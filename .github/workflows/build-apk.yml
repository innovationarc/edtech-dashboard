name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build pie Academy APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # ── 1. Checkout repo ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node ────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Setup Java ────────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 4. Setup Android SDK ─────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # ── 5. Install dependencies ──────────────────────────────────────────────
      - name: Install dependencies
        run: npm install
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: true
        timeout-minutes: 10

      # ── 5.5. Clear Vite cache (ensures fresh bundle every build) ─────────────
      - name: Clear Vite cache
        run: rm -rf node_modules/.vite dist

      # ── 6. Build React app (produces dist/) ──────────────────────────────────
      - name: Build React app
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GATEWAY_URL: ${{ secrets.VITE_GATEWAY_URL }}
          VITE_GATEWAY_APP_KEY: ${{ secrets.VITE_GATEWAY_APP_KEY }}
          VITE_RENDER_URL: ${{ secrets.VITE_RENDER_URL }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_SMS_MASTER_KEY: ${{ secrets.VITE_SMS_MASTER_KEY }}
        timeout-minutes: 10

      # ── 7. Add Android platform (skip if already exists) ─────────────────────
      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists, skipping."
          fi

      # ── 8. Create required directories ───────────────────────────────────────
      - name: Create Android asset directories
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/drawable-land
          mkdir -p android/app/src/main/res/drawable-port

      # ── 9. Copy splash resources ─────────────────────────────────────────────
      - name: Copy splash screen resources
        run: |
          rm -f android/app/src/main/res/drawable/splash.png
          rm -f android/app/src/main/res/drawable-land/splash.png
          rm -f android/app/src/main/res/drawable-port/splash.png

          cp android-assets/drawable/splash.xml android/app/src/main/res/drawable/splash.xml
          cp android-assets/drawable/splash.xml android/app/src/main/res/drawable-land/splash.xml
          cp android-assets/drawable/splash.xml android/app/src/main/res/drawable-port/splash.xml

          if [ -f "android-assets/splash_logo.png" ]; then
            cp android-assets/splash_logo.png android/app/src/main/res/drawable/splash_logo.png
          elif [ -f "public/icons/icon-512x512.png" ]; then
            cp public/icons/icon-512x512.png android/app/src/main/res/drawable/splash_logo.png
          else
            convert -size 288x288 xc:#6366f1 android/app/src/main/res/drawable/splash_logo.png 2>/dev/null || \
            echo "No splash logo found — splash will show solid color only"
          fi

      # ── 10. Sync Capacitor ───────────────────────────────────────────────────
      - name: Sync Capacitor with Android
        run: npx cap sync android
# ── 10.4. Verify dist was synced ─────────────────────────────────────────
      - name: Verify Capacitor sync
        run: |
          echo "── dist/ contents ──"
          ls -la dist/
          echo "── Synced assets ──"
          ls -la android/app/src/main/assets/public/
          echo "── index.html content ──"
          cat android/app/src/main/assets/public/index.html
      # ── 10.5. Patch AndroidManifest + network security config ────────────────
      - name: Patch AndroidManifest and add network security config
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          # Add hardwareAccelerated, cleartextTraffic, and networkSecurityConfig
          sed -i 's/<application/<application android:hardwareAccelerated="true" android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml\/network_security_config"/' "$MANIFEST"
          
          echo "── Patched manifest ──"
          cat "$MANIFEST"
          
          # Create network security config
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="true">localhost</domain>
              </domain-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system"/>
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF
          
          echo "── Network security config created ──"
          cat android/app/src/main/res/xml/network_security_config.xml

      # ── 11. Grant Gradle execute permission ──────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 12a. Build DEBUG APK ─────────────────────────────────────────────────
      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # ── 12b. Build RELEASE APK ───────────────────────────────────────────────
      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/pie-academy.keystore
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/pie-academy.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            --no-daemon

      # ── 13. Find and rename APK ──────────────────────────────────────────────
      - name: Locate APK
        id: find_apk
        run: |
          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          else
            APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          fi
          BUILD_DATE=$(date +%Y%m%d-%H%M)
          NEW_NAME="pie-academy-${{ github.event.inputs.build_type }}-${BUILD_DATE}.apk"
          cp "$APK_PATH" "$NEW_NAME"
          echo "apk_name=$NEW_NAME" >> $GITHUB_OUTPUT

      # ── 14. Upload APK ───────────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pie-academy-${{ github.event.inputs.build_type }}-apk
          path: ${{ steps.find_apk.outputs.apk_name }}
          retention-days: 30

      # ── 15. Summary ──────────────────────────────────────────────────────────
      - name: Build summary
        run: |
          echo "## ✅ pie Academy APK Built" >> $GITHUB_STEP_SUMMARY
          echo "- **Type:** ${{ github.event.inputs.build_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** ${{ steps.find_apk.outputs.apk_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Built at:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download from the **Artifacts** section above ⬆️" >> $GITHUB_STEP_SUMMARY
