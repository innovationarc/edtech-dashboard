name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build pie Academy APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # ── 1. Checkout repo ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node ────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Setup Java (required for Android Gradle build) ───────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 4. Setup Android SDK ─────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # ── 5. Install npm dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: npm install

      # ── 6. Sync Capacitor ────────────────────────────────────────────────────
      # No build step needed — APK is just a WebView shell pointing to Vercel.
      # All secrets and logic stay on Vercel's servers. Zero env vars needed here.
      - name: Sync Capacitor with Android
        run: npx cap sync android

      # ── 7. Grant Gradle execute permission ──────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 8a. Build DEBUG APK ──────────────────────────────────────────────────
      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # ── 8b. Build RELEASE APK ───────────────────────────────────────────────
      # Only the keystore is needed here — not your app secrets
      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/pie-academy.keystore
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/pie-academy.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            --no-daemon

      # ── 9. Find and rename APK ───────────────────────────────────────────────
      - name: Locate APK
        id: find_apk
        run: |
          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          else
            APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          fi
          BUILD_DATE=$(date +%Y%m%d-%H%M)
          NEW_NAME="pie-academy-${{ github.event.inputs.build_type }}-${BUILD_DATE}.apk"
          cp "$APK_PATH" "$NEW_NAME"
          echo "apk_name=$NEW_NAME" >> $GITHUB_OUTPUT

      # ── 10. Upload APK as downloadable artifact ──────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pie-academy-${{ github.event.inputs.build_type }}-apk
          path: ${{ steps.find_apk.outputs.apk_name }}
          retention-days: 30

      # ── 11. Summary ──────────────────────────────────────────────────────────
      - name: Build summary
        run: |
          echo "## ✅ pie Academy APK Built" >> $GITHUB_STEP_SUMMARY
          echo "- **Type:** ${{ github.event.inputs.build_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** ${{ steps.find_apk.outputs.apk_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **App loads:** https://edtech-dashboard-alpha.vercel.app" >> $GITHUB_STEP_SUMMARY
          echo "- **Built at:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download from the **Artifacts** section above ⬆️" >> $GITHUB_STEP_SUMMARY
